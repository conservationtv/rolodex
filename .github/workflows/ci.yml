name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        codec: [h264, h265]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --check
      - run: bash -n scripts/*.sh
      - run: cargo test -p rolodex-core -p rolodex-clip -p rolodex-repair -p rolodex -p rolodex-worker --no-default-features --features codec-${{ matrix.codec }}
      - run: cargo clippy -p rolodex-core -p rolodex-clip -p rolodex-repair -p rolodex --no-default-features --features codec-${{ matrix.codec }} --all-targets -- -D warnings
      - run: cargo check -p rolodex-clip --target wasm32-unknown-unknown --no-default-features --features codec-${{ matrix.codec }}
      - run: cargo check -p rolodex-worker --target wasm32-unknown-unknown --no-default-features --features codec-${{ matrix.codec }}
      - if: matrix.codec == 'h264'
        run: cargo check --manifest-path fuzz/Cargo.toml --bins

  feature-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Require exactly one codec feature
        run: |
          if cargo check -p rolodex-core --no-default-features; then
            exit 1
          fi
          if cargo check -p rolodex-core --no-default-features --features codec-h264,codec-h265; then
            exit 1
          fi

  fixture-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: ./scripts/verify-fixtures.sh

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
      - run: cargo audit --file fuzz/Cargo.lock
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit

  node-addon:
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            # Link against glibc 2.17, so the addon loads on older distributions.
            cross: --use-napi-cross
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            cross: --use-napi-cross
          - host: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.host }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: cargo clippy -p rolodex-node --all-targets -- -D warnings
      - working-directory: crates/rolodex-node
        run: pnpm exec napi build --platform --no-const-enum --profile release-node --target ${{ matrix.target }} ${{ matrix.cross }}
      - name: Generated bindings are committed
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: git diff --exit-code crates/rolodex-node/index.js crates/rolodex-node/index.d.ts
      - name: Load the addon and index both codecs
        run: |
          node -e '
            const { repairRecording } = require("./crates/rolodex-node");
            (async () => {
              for (const codec of ["h264", "h265"]) {
                const summary = await repairRecording(`fixtures/${codec}/mediamtx-v1.18.2-640x360.mp4`, "repaired.mp4");
                console.log(codec, JSON.stringify(summary));
                if (summary.outcome !== "unchanged" || summary.reason !== "not_needed") process.exit(1);
              }
            })().catch((error) => { console.error(error); process.exit(1); });
          '
      - uses: actions/upload-artifact@v4
        with:
          name: rolodex-repair-${{ matrix.target }}
          path: crates/rolodex-node/*.node
          if-no-files-found: error

  # Publishes @conservationtv/rolodex-repair and its platform packages to npm on a
  # rolodex-repair-v<version> tag matching crates/rolodex-node/package.json, with
  # npm trusted publishing: npm exchanges this job's OIDC token for a short-lived
  # publish token, and attaches provenance. Each of the five packages needs this
  # workflow (ci.yml) as its trusted publisher on npmjs.com.
  publish-node-addon:
    if: startsWith(github.ref, 'refs/tags/rolodex-repair-v')
    needs: [test, security-audit, node-addon]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@11.16.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: The tag names the package's version
        run: test "${GITHUB_REF_NAME#rolodex-repair-v}" = "$(node -p 'require("./crates/rolodex-node/package.json").version')"
      - uses: actions/download-artifact@v4
        with:
          pattern: rolodex-repair-*
          path: crates/rolodex-node/artifacts
          merge-multiple: true
      - working-directory: crates/rolodex-node
        run: |
          pnpm exec napi create-npm-dirs
          pnpm exec napi artifacts --output-dir artifacts
          pnpm exec napi pre-publish -t npm
          npm publish

  worker-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        codec: [h264, h265]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: worker-build@0.8.5
      - run: CODEC=${{ matrix.codec }} ./scripts/build-worker.sh
      - run: test -s crates/worker/build/worker/index.wasm
